<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HanZiKit</title>

  <style>/* {{CSS_INJECT}} */</style>

</head>
<body>

  <div class="container">
    <div id="view-hub" class="view active">
      <div class="header">
        <h1 id="main-title"> Loading...</h1>
        <p id="main-subtitle" style="color: var(--text-muted);"> HanZiKit</p>
      </div>

      <h2 class="section-title"> Global</h2>
      <div class="global-actions-panel">
        <button class="action-btn" onclick="alert('Lancement du test sur TOUT le vocabulaire')"> Test</button>
        <button class="action-btn" onclick="printGlobalVocab()"> Export voc</button>
        <button class="action-btn" onclick="printGlobalGrid()"> Export grids</button>
      </div>

      <h2 class="section-title"> Modules</h2>
      <div class="module-grid" id="hub-grid">
        <!-- JS generate -->
      </div>
    </div>

    <div id="view-module" class="view">
      <div class="nav-bar">
        <button class="btn-back" onclick="showHub()"> Hub</button>
        <h2 id="mod-title" style="margin:0;"> Titre du module</h2>
      </div>

      <div class="module-dashboard">
        <div class="stats-panel">
          <div class="stat-box">
            <div class="stat-number" id="mod-count">0</div>
            <div style="color: var(--text-muted); font-size: 0.9rem;">Mots dans la liste</div>
          </div>

          <div class="stat-box">
            <div class="stat-number" id="mod-success-rate" style="color: #198754;">--%</div>
            <div style="color: var(--text-muted); font-size: 0.9rem;">Taux de réussite</div>
          </div>
        </div>

        <h3 style="margin-top:0;"> Train on this module</h3>
        <div class="action-grid">
          <button class="action-btn" onclick="printModuleVocab()"> Export voc</button>
          <button class="action-btn" onclick="printModuleGrid()"> Export grids</button>
          <button class="action-btn" onclick="startFlashcards()"> FlashCard</button>
          <button class="action-btn" onclick="startTrace()"> Writing</button>
          <button class="action-btn"> Test</button>
        </div>
      </div>

      <h3 style="margin-top: 40px;"> Module words list</h3>
      <div id="mod-vocab-list" class="vocab-list">
        <!-- JS generate -->
      </div>

    </div>

    <div id="view-flashcards" class="view">
      <div class="nav-bar">
        <button class="btn-back" onclick="returnToModule()"> module</button>
        <h2 id="fc-title" style="margin:0;">Mode Flashcard</h2>
        <div style="margin-left: auto; font-weight: bold;" id="fc-counter">0/0</div>
      </div>

      <div class="flashcard-container">
        <!-- La nouvelle carte fixe -->
        <div class="fc-modern-card" id="fc-card">
          
          <!-- Bouton Skip (Haut Droite) -->
          <button class="fc-btn-skip" onclick="skipCard()">Skip ⏭</button>

          <!-- Zone Centrale : 3 Champs Masqués -->
          <div class="fc-center-content">
            
            <!-- Colonne Gauche : Pinyin (Haut) + Hanzi (Bas) -->
            <div class="fc-col-left">
              <div class="fc-reveal-field pinyin-field" onclick="revealField(this)">
                <div class="fc-hidden-content fc-pinyin-top" id="fc-pinyin">--</div>
                <div class="fc-mask">Pinyin</div>
              </div>
              
              <div class="fc-reveal-field hanzi-field" onclick="revealField(this)">
                <div class="fc-hidden-content fc-hanzi-main" id="fc-hanzi">--</div>
                <div class="fc-mask">Hanzi</div>
              </div>
            </div>

            <!-- Colonne Droite : Traduction -->
            <div class="fc-col-right">
              <div class="fc-reveal-field trans-field" onclick="revealField(this)">
                <div class="fc-hidden-content fc-translation-main" id="fc-translation">--</div>
                <div class="fc-mask">Traduction</div>
              </div>
            </div>
            
          </div>

          <!-- Bouton Audio (Bas Gauche) -->
          <button class="fc-btn-audio" onclick="speakFlashcardHanzi()">🔊</button>

          <!-- Boutons d'Évaluation (Bas Droite) -->
          <div class="fc-eval-group">
            <button class="fc-btn-fail" onclick="nextCard(false)">❌</button>
            <button class="fc-btn-pass" onclick="nextCard(true)">✅</button>
          </div>

        </div>
      </div>
    </div>

    <div id="view-trace" class="view">
      <div class="nav-bar">
        <button class="btn-back" onclick="returnToModule()"> Module</button>
        <h2 style="margin:0;"> Mode Tracé</h2>
      </div>
      
      <div class="card" style="margin: 0 auto; max-width: 400px; text-align: center; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        
        <!-- Traduction -->
        <div id="trace-translation" style="font-size: 1.3rem; font-weight: bold; margin-bottom: 15px;">--</div>
        
        <!-- Nouvelle disposition horizontale -->
        <div class="trace-layout">
          <!-- Pinyin au-dessus -->
          <div id="trace-pinyin" class="trace-pinyin">--</div>

          <!-- Conteneur pour afficher TOUTES les cases du mot côte à côte -->
          <div id="trace-targets-container" style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;">
            <!-- Les cases principales (150x150) seront injectées ici -->
          </div>

          <!-- Décomposition trait par trait en dessous -->
          <div id="stroke-decomposition" class="stroke-sequence" style="display: flex; flex-direction: column; gap: 15px; align-items: center;">
            <!-- Les séquences de chaque caractère seront injectées ici -->
          </div>
        </div>
        
        <!-- Boutons d'action -->
        <div style="margin-top: 25px; display: flex; gap: 15px; justify-content: center;">
          <button class="action-btn" style="padding: 10px 20px;" onclick="speakHanzi()"> Audio</button>
          <button class="action-btn" style="padding: 10px 20px;" onclick="nextTrace()"> Next</button>
        </div>
        
      </div>
    </div>
  </div>

  <div id="print-zone"></div>

  <script>
      const DECK_DATA = null /* {{JSON_INJECT}} */;
  </script>

  <script>/* {{JS_INJECT}} */</script>

</body>
</html>
